name: Bug report
description: Something works wrong or is missing, a platform included
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: What you ran, with the site or a trimmed page that shows the problem.
      placeholder: cmslens -json example.com
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What you expected to get, and why, such as the trace the platform leaves in the page.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What you got instead, output as is.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of cmslens -version, or the module version you import.

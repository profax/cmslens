name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Actions from actions/* keep their tags; third-party ones are pinned by hash
    steps:
      # nosemgrep: github-actions-mutable-action-tag
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Newest stable Go; never older than the toolchain line in go.mod
      # nosemgrep: github-actions-mutable-action-tag
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

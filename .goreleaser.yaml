version: 2

builds:
  - main: ./cmd/cmslens
    binary: cmslens
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{.Version}}"]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

# Notes come from the merged pull requests, sorted by .github/release.yml, so
# a breaking change gets a section of its own instead of hiding in the list
changelog:
  use: github-native
